name: kivo
description: KIVO – High-efficiency compressor for videos, images, and PDFs.
publish_to: "none"
version: 3.4.0+17

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  path_provider: ^2.1.2
  mime: ^2.0.0
  printing: ^5.15.1
  file_selector: ^1.1.0
  pdf: ^3.10.8
  image: ^4.1.3
  ffmpeg_kit_flutter_new: ^4.6.2
  flutter_image_compress: ^2.5.1
  package_info_plus: ^10.2.1
  desktop_drop: ^0.8.4
  xml: ^7.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: assets/images/logo.png
  android: true
  ios: true
  adaptive_icon_background: "#1C1C1E"
  adaptive_icon_foreground: assets/images/logo.png
  macos:
    generate: true
    image_path: assets/images/logo.png
  windows:
    generate: true
    image_path: assets/images/logo.png
  linux:
    generate: true
    image_path: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/bin/macos/ffmpeg
    - assets/bin/windows/ffmpeg.exe
    - assets/bin/linux/ffmpeg
