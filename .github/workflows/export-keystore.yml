name: Export Keystore (temporary — delete after use)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > kivo.jks

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivo-keystore
          path: kivo.jks
          retention-days: 1
